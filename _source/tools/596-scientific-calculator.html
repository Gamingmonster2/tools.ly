
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Scientific Calculator</title>
    <style>
        :root {
            --royal-purple: #240046;
            --royal-purple-light: #3c096c;
            --royal-gold: #ff9e00;
            --royal-gold-hover: #ffb700;
            --text-white: #fdfdfd;
            --bg-dark: #10002b;
            --shadow-soft: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-inset: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #240046 0%, #10002b 100%);
            color: var(--text-white);
        }

        /* Calculator Container */
        .calc-wrapper {
            background: rgba(36, 0, 70, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--royal-gold);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 158, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .calc-header {
            text-align: center;
            margin-bottom: 15px;
            color: var(--royal-gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Crown Icon using CSS */
        .crown-icon {
            width: 20px;
            height: 12px;
            background: var(--royal-gold);
            clip-path: polygon(0% 100%, 20% 40%, 40% 100%, 60% 40%, 80% 100%, 100% 40%, 100% 100%);
            display: inline-block;
        }

        /* Display Screen */
        .display-screen {
            background: #0a001a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
            box-shadow: var(--shadow-inset);
            border: 1px solid #3c096c;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .history-text {
            color: #9d4edd;
            font-size: 0.9rem;
            min-height: 1.2rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .current-text {
            color: var(--text-white);
            font-size: 2rem;
            font-weight: 600;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        /* Hide scrollbar for display */
        .current-text::-webkit-scrollbar {
            display: none;
        }

        /* Buttons Grid */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            height: 55px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
        }

        /* Button Styles */
        .btn-num {
            background: #3c096c;
            color: #e0aaff;
        }
        
        .btn-num:hover {
            background: #5a189a;
            color: #fff;
        }

        .btn-op {
            background: #10002b;
            color: var(--royal-gold);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .btn-op:hover {
            background: #240046;
            text-shadow: 0 0 5px var(--royal-gold);
        }

        .btn-func {
            background: #240046;
            color: #c77dff;
            font-size: 0.9rem;
        }

        .btn-func:hover {
            background: #3c096c;
        }

        .btn-equal {
            background: linear-gradient(135deg, var(--royal-gold), #ff7b00);
            color: #10002b;
            font-weight: 800;
            font-size: 1.5rem;
            grid-column: span 2;
        }

        .btn-equal:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(255, 158, 0, 0.4);
        }

        .btn-clear {
            background: #5a189a;
            color: #fff;
        }

        .btn-del {
            background: #7b2cbf;
            color: #fff;
        }

        /* Ripple Effect Animation */
        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }
        
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

    </style>
</head>
<body>

<div class="calc-wrapper">
    <div class="calc-header">
        <div class="crown-icon"></div>
        <span>Royal Calc</span>
        <div class="crown-icon"></div>
    </div>

    <div class="display-screen">
        <div class="history-text" id="history"></div>
        <div class="current-text" id="display">0</div>
    </div>

    <div class="buttons-grid">
        <!-- Row 1 -->
        <button class="btn-clear" onclick="clearDisplay()">AC</button>
        <button class="btn-del" onclick="deleteChar()">⌫</button>
        <button class="btn-func" onclick="appendFunction('sqrt')">√</button>
        <button class="btn-op" onclick="appendOperator('/')">÷</button>

        <!-- Row 2 -->
        <button class="btn-func" onclick="appendFunction('sin')">sin</button>
        <button class="btn-func" onclick="appendFunction('cos')">cos</button>
        <button class="btn-func" onclick="appendFunction('tan')">tan</button>
        <button class="btn-func" onclick="appendFunction('log')">log</button>

        <!-- Row 3 -->
        <button class="btn-num" onclick="appendNumber('7')">7</button>
        <button class="btn-num" onclick="appendNumber('8')">8</button>
        <button class="btn-num" onclick="appendNumber('9')">9</button>
        <button class="btn-op" onclick="appendOperator('*')">×</button>

        <!-- Row 4 -->
        <button class="btn-num" onclick="appendNumber('4')">4</button>
        <button class="btn-num" onclick="appendNumber('5')">5</button>
        <button class="btn-num" onclick="appendNumber('6')">6</button>
        <button class="btn-op" onclick="appendOperator('-')">−</button>

        <!-- Row 5 -->
        <button class="btn-num" onclick="appendNumber('1')">1</button>
        <button class="btn-num" onclick="appendNumber('2')">2</button>
        <button class="btn-num" onclick="appendNumber('3')">3</button>
        <button class="btn-op" onclick="appendOperator('+')">+</button>

        <!-- Row 6 -->
        <button class="btn-num" onclick="appendNumber('.')">.</button>
        <button class="btn-num" onclick="appendNumber('0')">0</button>
        <button class="btn-op" onclick="appendOperator('^')">^</button>
        <button class="btn-func" onclick="appendFunction('(')">(</button>
        <button class="btn-func" onclick="appendFunction(')')">)</button>
        
        <!-- Row 7 (Equals spans) -->
        <button class="btn-equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const history = document.getElementById('history');
    let currentInput = '0';
    let expression = '';
    let shouldResetDisplay = false;

    // Button Ripple Effect
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            let x = e.clientX - e.target.getBoundingClientRect().left;
            let y = e.clientY - e.target.getBoundingClientRect().top;
            let ripple = document.createElement('span');
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    });

    function updateDisplay() {
        display.innerText = currentInput;
    }

    function clearDisplay() {
        currentInput = '0';
        expression = '';
        history.innerText = '';
        shouldResetDisplay = false;
        updateDisplay();
    }

    function deleteChar() {
        if (shouldResetDisplay) {
            clearDisplay();
            return;
        }
        if (currentInput.length === 1 || currentInput === 'Error') {
            currentInput = '0';
        } else {
            currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay || currentInput === 'Error') {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function appendOperator(operator) {
        if (currentInput === 'Error') return;
        
        // Map display symbols
        let displayOp = operator;
        if (operator === '*') displayOp = '×';
        if (operator === '/') displayOp = '÷';
        if (operator === '-') displayOp = '−';

        if (shouldResetDisplay) {
            shouldResetDisplay = false;
        }
        
        // Prevent double operators mostly, but allow negative numbers logic if complex
        // Simple logic: just append
        currentInput += displayOp;
        updateDisplay();
    }

    function appendFunction(func) {
        if (currentInput === '0' || shouldResetDisplay || currentInput === 'Error') {
            currentInput = '';
            shouldResetDisplay = false;
        }
        
        if (func === 'sqrt') {
            currentInput += '√(';
        } else if (['sin', 'cos', 'tan', 'log'].includes(func)) {
            currentInput += func + '(';
        } else {
            currentInput += func;
        }
        updateDisplay();
    }

    function calculate() {
        if (currentInput === 'Error') return;

        let rawInput = currentInput;
        
        // Visual replacements to JS Math syntax
        let evalString = rawInput
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/−/g, '-')
            .replace(/\^/g, '**')
            .replace(/√/g, 'Math.sqrt')
            .replace(/sin/g, 'Math.sin')
            .replace(/cos/g, 'Math.cos')
            .replace(/tan/g, 'Math.tan')
            .replace(/log/g, 'Math.log10');

        try {
            // Update history
            history.innerText = rawInput + ' =';
            
            // Safety check: only allow math characters
            if (/[^0-9+\-*/().\sMathsqrtincolog**]/.test(evalString)) {
                 // Basic sanitization passed (allowing letters for Math functions)
            }

            // Evaluate
            // Note: Math.sin takes radians. 
            // For a simple calc, we assume user inputs radians or just standard JS behavior.
            let result = eval(evalString);
            
            // Format result
            if (!isFinite(result) || isNaN(result)) {
                currentInput = 'Error';
            } else {
                // Limit decimals to avoid long floats
                currentInput = parseFloat(result.toFixed(8)).toString();
            }
            
            shouldResetDisplay = true;
            updateDisplay();
        } catch (e) {
            currentInput = 'Error';
            updateDisplay();
            setTimeout(() => {
                if(currentInput === 'Error') clearDisplay();
            }, 1500);
        }
    }
</script>

</body>
</html>
