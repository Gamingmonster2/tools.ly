
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo-Friend Interactive</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --robot-stroke: #2d3436;
            --robot-fill: #ffffff;
            --accent-color: #0984e3;
            --screen-bg: #dfe6e9;
            --speech-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #e2eafc, #f0f4f8);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* Game UI Overlay */
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none; /* Let clicks pass through to robot */
        }

        .stat-box {
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: bold;
            color: var(--robot-stroke);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .progress-bar {
            width: 100px;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00b894;
            transition: width 0.3s ease;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: 15%;
            background: var(--speech-bg);
            border: 3px solid var(--robot-stroke);
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 1.2rem;
            color: var(--text-color);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 280px;
            text-align: center;
            z-index: 10;
        }

        .speech-bubble.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: var(--robot-stroke) transparent transparent transparent;
        }

        /* The Robot Container */
        .robot-container {
            position: relative;
            width: 300px;
            height: 400px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .robot-container:active {
            transform: scale(0.95);
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .stroke-draw {
            fill: var(--robot-fill);
            stroke: var(--robot-stroke);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .screen-shape {
            fill: none;
            stroke: var(--robot-stroke);
            stroke-width: 2;
            transition: fill 0.3s;
            cursor: pointer;
        }
        
        .screen-shape:hover {
            fill: var(--accent-color);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(5deg); }
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        @keyframes talk {
            0%, 100% { d: path("M 70 75 Q 100 90 130 75"); }
            50% { d: path("M 70 75 Q 100 100 130 75"); }
        }

        .robot-group {
            animation: float 3s ease-in-out infinite;
            transform-origin: center;
        }

        .arm-left {
            transform-origin: 40px 130px;
        }
        
        .arm-right {
            transform-origin: 160px 130px;
        }

        .robot-container.waving .arm-right {
            animation: wave 0.5s ease-in-out infinite;
        }

        .robot-container.talking .mouth {
            animation: talk 0.2s infinite;
        }

        .eyes {
            transform-origin: center;
            animation: blink 4s infinite;
        }

        /* Confetti for Gamification */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="stat-box">
            <span>Friendship Level</span>
            <div class="progress-bar">
                <div class="progress-fill" id="friendship-bar"></div>
            </div>
        </div>
        <div class="stat-box">
            <span>⚡ Energy</span>
            <span id="energy-val">100%</span>
        </div>
    </div>

    <div id="speech-bubble" class="speech-bubble">
        Hello! I am Robo.
    </div>

    <div class="robot-container" id="robot" onclick="interactRobot()">
        <svg viewBox="0 0 200 320">
            <g class="robot-group">
                <!-- Antenna -->
                <line x1="100" y1="30" x2="100" y2="10" class="stroke-draw" />
                <circle cx="100" cy="10" r="5" class="stroke-draw" />
                <path d="M 90 20 Q 100 15 110 20" class="stroke-draw" fill="none" />
                <path d="M 92 25 Q 100 20 108 25" class="stroke-draw" fill="none" />

                <!-- Ears -->
                <rect x="20" y="50" width="20" height="30" rx="5" class="stroke-draw" />
                <rect x="160" y="50" width="20" height="30" rx="5" class="stroke-draw" />
                <!-- Ear details -->
                <line x1="20" y1="60" x2="40" y2="60" class="stroke-draw" stroke-width="1"/>
                <line x1="20" y1="70" x2="40" y2="70" class="stroke-draw" stroke-width="1"/>
                <line x1="160" y1="60" x2="180" y2="60" class="stroke-draw" stroke-width="1"/>
                <line x1="160" y1="70" x2="180" y2="70" class="stroke-draw" stroke-width="1"/>

                <!-- Head -->
                <rect x="40" y="30" width="120" height="80" rx="15" class="stroke-draw" />

                <!-- Eyes -->
                <g class="eyes">
                    <circle cx="70" cy="60" r="12" class="stroke-draw" />
                    <circle cx="70" cy="60" r="4" fill="#333" />
                    <circle cx="130" cy="60" r="12" class="stroke-draw" />
                    <circle cx="130" cy="60" r="4" fill="#333" />
                </g>

                <!-- Nose -->
                <ellipse cx="100" cy="75" rx="8" ry="6" class="stroke-draw" />

                <!-- Mouth -->
                <path class="mouth stroke-draw" d="M 70 90 Q 100 105 130 90" fill="none" />

                <!-- Neck -->
                <rect x="90" y="110" width="20" height="15" class="stroke-draw" />

                <!-- Body -->
                <rect x="50" y="125" width="100" height="90" rx="10" class="stroke-draw" />
                
                <!-- Chest Screen -->
                <rect x="65" y="140" width="70" height="50" rx="5" class="stroke-draw" style="fill: var(--screen-bg);" />
                
                <!-- Shapes on Screen (Interactive Buttons) -->
                <g id="chest-shapes">
                    <!-- Triangle -->
                    <path d="M 75 175 L 85 155 L 95 175 Z" class="screen-shape" onclick="miniGame('triangle', event)" />
                    <!-- Circle -->
                    <circle cx="115" cy="155" r="8" class="screen-shape" onclick="miniGame('circle', event)" />
                    <!-- Diamond -->
                    <rect x="108" y="170" width="14" height="14" transform="rotate(45 115 177)" class="screen-shape" onclick="miniGame('diamond', event)" />
                </g>

                <!-- Body Dots -->
                <circle cx="70" cy="205" r="2" fill="#333" />
                <circle cx="100" cy="205" r="2" fill="#333" />
                <circle cx="130" cy="205" r="2" fill="#333" />

                <!-- Left Arm -->
                <g class="arm-left">
                    <path d="M 50 140 Q 20 160 20 200" class="stroke-draw" fill="none" />
                    <!-- Arm Segments -->
                    <line x1="42" y1="145" x2="35" y2="148" class="stroke-draw" stroke-width="1"/>
                    <line x1="30" y1="155" x2="24" y2="160" class="stroke-draw" stroke-width="1"/>
                    <line x1="22" y1="170" x2="18" y2="172" class="stroke-draw" stroke-width="1"/>
                    <!-- Hand -->
                    <path d="M 10 200 A 10 10 0 0 1 30 200" class="stroke-draw" fill="none" transform="rotate(-90 20 200)" />
                </g>

                <!-- Right Arm -->
                <g class="arm-right">
                    <path d="M 150 140 Q 180 160 180 200" class="stroke-draw" fill="none" />
                    <!-- Arm Segments -->
                    <line x1="158" y1="145" x2="165" y2="148" class="stroke-draw" stroke-width="1"/>
                    <line x1="170" y1="155" x2="176" y2="160" class="stroke-draw" stroke-width="1"/>
                    <line x1="178" y1="170" x2="182" y2="172" class="stroke-draw" stroke-width="1"/>
                    <!-- Hand -->
                    <path d="M 170 200 A 10 10 0 0 1 190 200" class="stroke-draw" fill="none" transform="rotate(90 180 200)" />
                </g>

                <!-- Legs -->
                <!-- Left Leg -->
                <path d="M 80 215 Q 70 250 60 280" class="stroke-draw" fill="none" />
                <line x1="78" y1="225" x2="72" y2="225" class="stroke-draw" stroke-width="1"/>
                <line x1="75" y1="240" x2="68" y2="240" class="stroke-draw" stroke-width="1"/>
                <line x1="70" y1="255" x2="64" y2="255" class="stroke-draw" stroke-width="1"/>
                <!-- Left Foot -->
                <path d="M 40 280 H 80 Q 80 260 60 260 Q 40 260 40 280 Z" class="stroke-draw" />

                <!-- Right Leg -->
                <path d="M 120 215 Q 130 250 140 280" class="stroke-draw" fill="none" />
                <line x1="122" y1="225" x2="128" y2="225" class="stroke-draw" stroke-width="1"/>
                <line x1="125" y1="240" x2="132" y2="240" class="stroke-draw" stroke-width="1"/>
                <line x1="130" y1="255" x2="136" y2="255" class="stroke-draw" stroke-width="1"/>
                <!-- Right Foot -->
                <path d="M 120 280 H 160 Q 160 260 140 260 Q 120 260 120 280 Z" class="stroke-draw" />

            </g>
        </svg>
    </div>

    <script>
        const phrases = [
            "Hello!",
            "Welcome to our website!",
            "I am a robot.",
            "Beep Boop!",
            "System Online.",
            "You clicked me!",
            "I like your mouse cursor.",
            "Let's be friends!",
            "Processing request...",
            "My sensors detect happiness.",
            "Do you like my antenna?",
            "01001000 01001001"
        ];

        const robot = document.getElementById('robot');
        const bubble = document.getElementById('speech-bubble');
        const friendshipBar = document.getElementById('friendship-bar');
        const energyVal = document.getElementById('energy-val');
        
        let friendship = 0;
        let energy = 100;
        let isTalking = false;

        function interactRobot() {
            if(energy <= 0) {
                bubble.textContent = "Low Battery... zzz...";
                bubble.classList.add('visible');
                return;
            }

            // 1. Show Random Phrase
            const randomIndex = Math.floor(Math.random() * phrases.length);
            bubble.textContent = phrases[randomIndex];
            bubble.classList.add('visible');

            // 2. Animate Robot
            robot.classList.add('talking');
            robot.classList.add('waving');

            // 3. Update Game Stats
            if (friendship < 100) {
                friendship += 10;
                friendshipBar.style.width = friendship + '%';
                
                if(friendship === 100) {
                    celebrate();
                    bubble.textContent = "We are best friends now!";
                }
            }
            
            energy -= 5;
            energyVal.textContent = energy + '%';

            // 4. Reset Animation timers
            clearTimeout(robot.talkTimer);
            robot.talkTimer = setTimeout(() => {
                bubble.classList.remove('visible');
                robot.classList.remove('talking');
                robot.classList.remove('waving');
            }, 2000);
        }

        // Mini interactions for chest shapes
        function miniGame(shape, event) {
            event.stopPropagation(); // Don't trigger main robot click
            
            if (shape === 'triangle') {
                document.body.style.background = "radial-gradient(circle at center, #ffeaa7, #fab1a0)";
                bubble.textContent = "Theme changed: Sunset!";
            } else if (shape === 'circle') {
                document.body.style.background = "radial-gradient(circle at center, #e2eafc, #f0f4f8)";
                bubble.textContent = "Theme reset: Classic.";
            } else if (shape === 'diamond') {
                energy = 100;
                energyVal.textContent = "100%";
                bubble.textContent = "Recharged! Thanks!";
                createConfetti(event.clientX, event.clientY);
            }
            
            bubble.classList.add('visible');
            setTimeout(() => bubble.classList.remove('visible'), 1500);
        }

        function celebrate() {
            for(let i=0; i<50; i++) {
                setTimeout(() => {
                    createConfetti(Math.random() * window.innerWidth, -10);
                }, i * 50);
            }
        }

        function createConfetti(x, y) {
            const colors = ['#00b894', '#0984e3', '#d63031', '#fdcb6e', '#6c5ce7'];
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = x + 'px';
            confetti.style.top = y + 'px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
            
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 3000);
        }
    </script>
</body>
</html>
